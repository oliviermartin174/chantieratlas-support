<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Assistance et confidentialité de l’application ChantierAtlas.">
  <title>ChantierAtlas — Assistance et confidentialité</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #102a43; background: #f8fbff; }
    body { margin: 0; }
    main { box-sizing: border-box; max-width: 820px; min-height: 100vh; margin: auto; padding: 64px 24px; }
    .hero { padding: 40px; border-radius: 28px; color: white; background: linear-gradient(135deg, #12365e, #25658c); box-shadow: 0 20px 48px rgb(18 54 94 / 18%); }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; }
    p { line-height: 1.65; }
    nav { display: grid; gap: 16px; margin-top: 28px; }
    a { display: block; padding: 22px 24px; border: 1px solid #dbe6ef; border-radius: 20px; color: #12365e; background: white; font-size: 1.15rem; font-weight: 700; text-decoration: none; box-shadow: 0 10px 30px rgb(18 54 94 / 7%); }
    a:hover, a:focus-visible { border-color: #25658c; outline: none; transform: translateY(-1px); }
    footer { margin-top: 32px; color: #52677a; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>ChantierAtlas</h1>
      <p>Retrouvez l’assistance de l’application et les informations relatives à la confidentialité.</p>
    </section>
    <nav aria-label="Informations ChantierAtlas">
      <a href="assistance/">Assistance ChantierAtlas →</a>
      <a href="confidentialite/">Politique de confidentialité →</a>
    </nav>
    <footer>Contact : contact@objectivemethod.fr</footer>
  </main>
</body>
</html>
